name: Fix P2.1 focus harness
on:
  push:
    branches:
      - agent/p1-final-validation
    paths:
      - .github/workflows/fix-p2-1-focus-validation.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-final-validation
      - name: Make Menu focus assertion deterministic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('validation/p2_1_header_targeted.cjs')
          s=p.read_text()
          old="""        await page.evaluate(() => { document.activeElement?.blur(); window.scrollTo(0, 0); });\n        await page.keyboard.press('Tab');\n        const focusStyle = await page.evaluate(() => {\n          const el=document.activeElement, s=getComputedStyle(el);\n          return { id:el.id, outline:s.outlineStyle, width:s.outlineWidth, color:s.outlineColor };\n        });\n        check(focusStyle.id === 'mobileNavToggle' && focusStyle.outline !== 'none' && Number.parseFloat(focusStyle.width) >= 3, 'Header retains strong visible keyboard focus', JSON.stringify(focusStyle));\n"""
          new="""        await page.evaluate(() => {\n          const body=document.body;\n          body.setAttribute('tabindex','-1');\n          body.focus();\n          window.scrollTo(0, 0);\n        });\n        await page.keyboard.press('Tab');\n        const focusStyle = await page.evaluate(() => {\n          const el=document.activeElement, s=getComputedStyle(el);\n          document.body.removeAttribute('tabindex');\n          return { id:el.id, outline:s.outlineStyle, width:s.outlineWidth, color:s.outlineColor };\n        });\n        check(focusStyle.id === 'mobileNavToggle' && focusStyle.outline !== 'none' && Number.parseFloat(focusStyle.width) >= 3, 'Header retains strong visible keyboard focus', JSON.stringify(focusStyle));\n"""
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          node --check validation/p2_1_header_targeted.cjs
          git diff -- validation/p2_1_header_targeted.cjs
      - name: Commit validation-only focus correction
        run: |
          git config user.name 'KEM validation agent'
          git config user.email 'actions@users.noreply.github.com'
          git add validation/p2_1_header_targeted.cjs
          git commit -m 'Make P2.1 focus validation deterministic'
          git push origin HEAD:agent/p1-final-validation
