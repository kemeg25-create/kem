name: P1 admin reliability
on:
  push:
    branches: [agent/p1-remediation]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: python3 scripts/p1_admin_reliability.py
      - name: Verify
        run: |
          node --check functions/index.js
          python3 -m json.tool database.rules.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          h=Path('index.html').read_text(); b=Path('functions/index.js').read_text()
          for block in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I):
              if not block.strip() or (block.lstrip().startswith('{') and '"@context"' in block): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False); f.write(block); f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          assert len(re.findall(r'async function\s+showDashboard\s*\(',h)) == 1
          dash=h[h.index('async function showDashboard'):h.index('async function logoutEmployee')]
          assert dash.index('await loadAdminData()') < dash.index("employeeDashboard').classList.add('active')")
          assert 'let products = [];' in h and 'let orders = [];' in h
          for fn in ['updateStoreSetting','saveSocialLinks','saveAnnouncement','saveCoupon','saveProductDiscount','saveThresholdDiscount','deleteEmployee','deleteProduct']:
              segment=h[h.index('function '+fn) if 'function '+fn in h else h.index('async function '+fn):]
              assert 'await saveToFirebase' in segment[:3000], fn
          assert 'makeDashboardTablesResponsive' in h
          assert 'revokeEmployeeSession' in h and 'await auth.signOut()' in h
          assert "paymentMethod !== 'cod'" in b and 'requireVerifiedCustomer' in b
          print('admin reliability and P0 guardrails pass')
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix P1 dashboard and admin save reliability'
          git push origin HEAD:agent/p1-remediation
