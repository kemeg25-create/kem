name: P1 remediation
on:
  push:
    branches: [agent/p1-remediation]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply mobile search batch
        run: python3 scripts/p1_mobile_search.py
      - name: Syntax checks
        run: |
          node --check functions/index.js
          python3 -m json.tool database.rules.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          html=Path('index.html').read_text()
          for block in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
              if not block.strip() or (block.lstrip().startswith('{') and '"@context"' in block): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False); f.write(block); f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          PY
      - name: P1 and P0 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(); b=Path('functions/index.js').read_text(); r=Path('database.rules.json').read_text()
          assert 'id="mobileNavToggle"' in h and 'id="primaryNav"' in h
          assert 'id="shopSearch"' in h and 'id="shopFilterButtons"' in h
          assert len(re.findall(r'function\s+filterByCategory\s*\(',h)) == 1
          assert len(re.findall(r'function\s+renderShopProducts\s*\(',h)) == 1
          assert 'loading="lazy"' in h
          assert 'revokeEmployeeSession' in h and 'await auth.signOut()' in h
          assert 'requireVerifiedCustomer' in b and "paymentMethod !== 'cod'" in b
          assert 'getEmployeeForRequest(request' in b
          assert '"orders"' in r and '".write": false' in r
          assert "readPublicPath('coupons')" not in h
          print('P1 mobile/search and P0 guardrails pass')
          PY
      - name: Diff check
        run: git diff --check
      - name: Commit production change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix P1 mobile navigation and storefront search'
          git push origin HEAD:agent/p1-remediation
