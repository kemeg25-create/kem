name: P1 customer account
on:
  push:
    branches: [agent/p1-remediation]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: python3 scripts/p1_account.py
      - working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify
        run: |
          node --check functions/index.js
          python3 -m json.tool database.rules.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          h=Path('index.html').read_text(); b=Path('functions/index.js').read_text()
          for block in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I):
              if not block.strip() or (block.lstrip().startswith('{') and '"@context"' in block): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False); f.write(block); f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          assert 'id="accountModal"' in h and 'function openAccountModal' in h
          assert 'exports.getCustomerOrders' in b and "order?.customerUid === uid" in b
          assert 'revokeEmployeeSession' in h and 'await auth.signOut()' in h
          assert "paymentMethod !== 'cod'" in b and 'requireVerifiedCustomer' in b
          print('account and P0 checks pass')
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html functions/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add secure customer account order history'
          git push origin HEAD:agent/p1-remediation
