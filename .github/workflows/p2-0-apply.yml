name: P2.0 design system apply
on:
  push:
    branches:
      - agent/p1-final-validation
    paths:
      - validation/apply_p2_0_design_system.py
      - .github/workflows/p2-0-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4
        with:
          ref: agent/p1-final-validation
          path: harness
      - name: Checkout exact P2 baseline
        uses: actions/checkout@v4
        with:
          ref: agent/p2-visual-ux
          fetch-depth: 0
          path: app
      - name: Verify frozen baseline
        working-directory: app
        run: |
          test "$(git rev-parse HEAD)" = "471860f83750cd239627213608f7fd7b39d41adf"
          git status --short
      - name: Apply P2.0 CSS-only foundation
        working-directory: app
        run: |
          python3 ../harness/validation/apply_p2_0_design_system.py
          test "$(git diff --name-only)" = "index.html"
          test -z "$(git diff -- functions functions/index.js database.rules.json firebase.json)"
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          h=Path('index.html').read_text()
          required=[
            '--color-ink: #0A0A0A;',
            '--color-kem-pink: #FF3366;',
            '--color-kem-green: #00FF99;',
            '--space-128: 128px;',
            '--container-customer: 1400px;',
            '--motion-standard: 200ms;',
            '.kem-btn-primary',
            '.kem-field-error',
            '.kem-dashboard-card,',
            '.kem-state-success',
            '@media (prefers-reduced-motion: reduce)',
          ]
          for item in required: assert item in h,item
          body=re.search(r'body\s*\{(.*?)\}',h,re.S).group(1)
          assert 'overflow-x: hidden' not in body
          for attrs, script in re.findall(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I):
              if 'application/ld+json' in attrs.lower() or not script.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False); f.write(script); f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          print('P2.0 static CSS/source scope verified')
          PY
      - name: Commit P2.0 production change
        working-directory: app
        run: |
          git config user.name 'KEM P2 agent'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add P2.0 global design system'
          git push origin HEAD:agent/p2-visual-ux
          echo "P2_0_COMMIT=$(git rev-parse HEAD)"
