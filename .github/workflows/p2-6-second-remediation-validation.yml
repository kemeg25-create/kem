name: P2.6 second remediation committed-source validation

on:
  push:
    branches: [agent/p1-final-validation]
    paths:
      - validation/remediate_p2_6_second_pass.py
      - .github/workflows/p2-6-second-remediation-validation.yml

permissions:
  contents: write

jobs:
  remediate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }

      - name: Gate current failed P2.6 and amend only index.html
        run: |
          set -euo pipefail
          P25=eadc7b2016f3bd1fb5b531cc547cac00686453d3
          OLDP26=fc31e2fc5fd3a3cf5f98cd1b9688acd3e6866ee6
          git fetch origin agent/p2-visual-ux
          test "$(git rev-parse origin/agent/p2-visual-ux)" = "$OLDP26"
          test "$(git rev-parse $OLDP26^)" = "$P25"
          test "$(git rev-list --count $P25..$OLDP26)" = "1"
          test "$(git diff --name-only $P25 $OLDP26)" = "index.html"
          cp validation/remediate_p2_6_second_pass.py /tmp/remediate_p2_6_second.py
          git checkout -B p26-remediate "$OLDP26"
          python3 /tmp/remediate_p2_6_second.py index.html
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          git diff --exit-code -- functions database.rules.json firebase.json storage.rules 2>/dev/null || exit 1
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          h=Path('index.html').read_text()
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I):
              if 'application/ld+json' in attrs.lower() or not body.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False);f.write(body);f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          account=h[h.index('P2.6 — ACCOUNT / AUTHENTICATION'):]
          assert '.account-address-default' in account and 'text-transform:uppercase' not in account[account.index('.account-address-default'):account.index('.account-address-default')+220]
          assert '#accountModal .close-modal:focus{outline:3px solid var(--color-kem-pink);outline-offset:3px}' in h
          assert "switchAuthTab('login');document.getElementById('loginIdentifier')?.focus();" in h
          assert "if(t?.isConnected)t.focus()" in h
          assert '@media(max-width:768px){#accountModal .account-layout{grid-template-columns:1fr' in h
          assert "button.setAttribute('aria-label', 'Account');" in h
          assert "auth.signInWithEmailAndPassword(email, password)" in h
          assert "await openAccountModal();" in h[h.index('async function handleLogin'):h.index('async function handleSignup')]
          assert "auth.sendPasswordResetEmail(email)" in h
          assert 'async function logoutEmployee()' in h
          PY
          git config user.name 'KEM Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit --amend --no-edit
          test "$(git log -1 --format=%s)" = "Implement P2.6 account and authentication redesign"
          test "$(git rev-parse HEAD^)" = "$P25"
          test "$(git rev-list --count $P25..HEAD)" = "1"
          test "$(git diff --name-only $P25 HEAD)" = "index.html"
          P26="$(git rev-parse HEAD)"
          git push --force-with-lease=refs/heads/agent/p2-visual-ux:$OLDP26 origin HEAD:agent/p2-visual-ux
          echo "P26=$P26" >> "$GITHUB_ENV"
          echo "P25=$P25" >> "$GITHUB_ENV"

      - name: Load exact amended P2.6 and frozen suites
        run: |
          set -euo pipefail
          git checkout agent/p1-final-validation
          git fetch origin agent/p2-visual-ux
          test "$(git rev-parse origin/agent/p2-visual-ux)" = "$P26"
          test "$(git rev-parse $P26^)" = "$P25"
          test "$(git rev-list --count $P25..$P26)" = "1"
          test "$(git diff --name-only $P25 $P26)" = "index.html"
          git checkout "$P26" -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
          git show a4faeca2d0e7663e5230a1997ad777a9ba58c8e3:validation/p2_5_cart_checkout_targeted.cjs > /tmp/p2_5.cjs
          git show 411e5fc1ef75e19de360f1bf224d297c89968d4c:validation/p2_4_product_detail_targeted.cjs > /tmp/p2_4.cjs
          git show a43242d59f8c258de698f4770d6e732b9ac00283:validation/p2_3_shop_targeted.cjs > /tmp/p2_3.cjs
          git show b49e760e0df1fba774d9a8e332a67dc1b84d568a:validation/p2_1_header_targeted.cjs > /tmp/p2_1.cjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p2_4.cjs');src=p.read_text()
          old="""      await page.locator('#productDetailModal .add-to-cart-btn').focus();
                const focus = await page.locator('#productDetailModal .add-to-cart-btn').evaluate(el => { const s=getComputedStyle(el); return {width:s.outlineWidth,style:s.outlineStyle,color:s.outlineColor}; });
                check(focus.width === '3px' && focus.style === 'solid', `P2.1 3px visible keyboard focus remains intact in product detail at ${width}px`, JSON.stringify(focus));"""
          new="""      await page.getByRole('button', { name: 'Increase quantity' }).focus();
                await page.keyboard.press('Tab');
                const focus = await page.locator('#productDetailModal .add-to-cart-btn').evaluate(el => { const s=getComputedStyle(el); return {active:document.activeElement===el,width:s.outlineWidth,style:s.outlineStyle,color:s.outlineColor}; });
                check(focus.active && focus.width === '3px' && focus.style === 'solid', `P2.1 3px visible keyboard focus remains intact in product detail at ${width}px`, JSON.stringify(focus));"""
          if old in src: p.write_text(src.replace(old,new,1))
          PY

      - name: Install emulator and Chromium tooling
        run: |
          npm --prefix functions install --ignore-scripts --no-audit --no-fund
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false firebase-tools playwright >/dev/null
          npx playwright install --with-deps chromium

      - name: Prepare isolated emulator wiring only
        run: |
          python3 validation/prepare_emulator.py
          python3 validation/patch_functions_runtime.py
          python3 validation/full_runtime_patch.py
          node --check functions/index.js
          node --check validation/p2_6_auth_account_targeted.cjs
          node --check /tmp/p2_5.cjs
          node --check /tmp/p2_4.cjs
          node --check /tmp/p2_3.cjs
          node --check validation/p2_2_homepage_targeted.cjs
          node --check /tmp/p2_1.cjs
          node --check validation/p1_reconciliation_targeted.cjs
          node --check validation/dashboard_targeted.cjs
          node --check validation/smoke.cjs
          git diff -U0 "$P26" -- index.html functions/index.js > /tmp/runtime-app.diff || true
          if grep -E 'P2\.6|authModal|accountModal|loginForm|signupForm|resetPassword|handleLogin|handleSignup|openAccountModal|logoutUser|employeeModal|logoutEmployee|P2\.5|cartPage|checkoutPage|quoteOrder|createOrder|P2\.4|product-detail|P2\.3|kem-shop|P2\.2|home-hero|P2\.1|nav-shell' /tmp/runtime-app.diff; then
            cat /tmp/runtime-app.diff
            echo 'Runtime preparation altered committed application behavior'
            exit 1
          fi
          echo 'Runtime preparation is endpoint/project emulator wiring only'

      - name: P2.6 seven-width Account Auth validation
        env: &emulator_env
          NODE_PATH: ${{ github.workspace }}/functions/node_modules:${{ github.workspace }}/node_modules
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          GCLOUD_PROJECT: demo-kem-validation
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 240s node validation/p2_6_auth_account_targeted.cjs"

      - name: Frozen P2.5 Cart Checkout 288 assertions
        env: *emulator_env
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 240s node /tmp/p2_5.cjs"

      - name: Frozen P2.4 Product Detail 173 assertions
        env: *emulator_env
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 180s node /tmp/p2_4.cjs"

      - name: Frozen P2.3 Collection Shop 196 assertions
        env: *emulator_env
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 180s node /tmp/p2_3.cjs"

      - name: Frozen P2.2 Homepage 241 assertions
        env: *emulator_env
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 160s node validation/p2_2_homepage_targeted.cjs"

      - name: Frozen P2.1 Header Navigation 166 assertions
        env: *emulator_env
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 130s node /tmp/p2_1.cjs"

      - name: P1 reconciliation validation
        env: *emulator_env
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 100s node validation/p1_reconciliation_targeted.cjs"

      - name: Employee dashboard seven-width validation
        env: *emulator_env
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 100s node validation/dashboard_targeted.cjs"

      - name: Full frozen P0 P1 integration 79 assertions
        env: *emulator_env
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 200s node validation/smoke.cjs"

      - name: Restore exact source and final security static guards
        if: always()
        run: |
          set -euo pipefail
          git checkout -- validation/smoke.cjs validation/seed.cjs || true
          git checkout "$P26" -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
          rm -f package.json package-lock.json firebase-debug.log database-debug.log ui-debug.log
          rm -rf node_modules functions/node_modules functions/package-lock.json
          node --check functions/index.js
          python3 -m json.tool database.rules.json >/dev/null
          python3 -m json.tool firebase.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess,tempfile,os
          h=Path('index.html').read_text();b=Path('functions/index.js').read_text();rules=json.loads(Path('database.rules.json').read_text())['rules']
          for body in re.findall(r'<script\s+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',h,re.S|re.I): json.loads(body)
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I):
              if 'application/ld+json' in attrs.lower() or not body.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False);f.write(body);f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          for x in ['P2.6 — ACCOUNT / AUTHENTICATION','P2.5 — CART / CHECKOUT','P2.4 — PRODUCT DETAIL','P2.3 — COLLECTION / SHOP','P2.2 — HOMEPAGE','P2.1 — HEADER / NAVIGATION','--color-kem-pink: #FF3366;','@media (prefers-reduced-motion: reduce)']: assert x in h,x
          for x in ["auth.signInWithEmailAndPassword(email, password)","auth.createUserWithEmailAndPassword(email, password)",'credential.user.sendEmailVerification()',"auth.sendPasswordResetEmail(email)","cloudFunctions.httpsCallable('getCustomerOrders')",'async function logoutUser()','async function logoutEmployee()']: assert x in h,x
          assert 'requireVerifiedCustomer' in b and 'email_verified' in b and 'auth.revokeRefreshTokens' in b and 'tokensValidAfterTime' in b
          assert rules['orders']['.read'] is False and rules['orders']['.write'] is False and rules['employeeRoles']['.read'] is False and rules['employeeRoles']['.write'] is False
          assert 'exports.getCustomerOrders' in b and "order?.customerUid === uid" in b
          body_css=re.search(r'body\s*\{(.*?)\}',re.search(r'<style>(.*?)</style>',h,re.S|re.I).group(1),re.S).group(1)
          assert 'overflow-x: hidden' not in body_css
          assert h.count("window.addEventListener('popstate'")==1
          assert h.count("document.addEventListener('keydown', event => {")==1
          assert "prompt('Enter your email address to reset your password:')" not in h
          assert 'lockCustomerDialogScroll()' in h and "await openAccountModal();" in h
          assert '#accountModal .close-modal:focus{outline:3px solid var(--color-kem-pink);outline-offset:3px}' in h
          assert "button.setAttribute('aria-label', 'Account');" in h
          print('Exact amended P2.6 source and frozen security/static guards verified')
          PY
          git diff --check
          test "$(git rev-parse $P26^)" = "$P25"
          test "$(git rev-list --count $P25..$P26)" = "1"
          test "$(git diff --name-only $P25 $P26)" = "index.html"
          git diff --exit-code "$P26" -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
