name: P1 integration smoke
on:
  push:
    branches:
      - agent/p1-integration-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify validation branch base and production files
        run: |
          git merge-base --is-ancestor 317cf982aa1ae0cb4f39550521b8899dba5f88d3 HEAD
          git diff --exit-code 317cf982aa1ae0cb4f39550521b8899dba5f88d3 HEAD -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
      - name: Install emulator and browser tooling
        run: |
          npm --prefix functions install --ignore-scripts --no-audit --no-fund
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false firebase-tools playwright >/dev/null
          npx playwright install --with-deps chromium
      - name: Prepare isolated emulator runtime
        run: |
          python3 validation/prepare_emulator.py
          python3 validation/patch_functions_runtime.py
          python3 -m json.tool firebase.json >/dev/null
          node --check functions/index.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('validation/smoke.cjs')
          h=p.read_text()
          h=h.replace("require('../functions/node_modules/firebase-admin/app')", "require('firebase-admin/app')")
          h=h.replace("require('../functions/node_modules/firebase-admin/database')", "require('firebase-admin/database')")
          h=h.replace("require('../functions/node_modules/firebase-admin/storage')", "require('firebase-admin/storage')")
          old="await page.evaluate(() => openAuthModal());\n  await page.fill('#loginIdentifier', email);"
          new="await page.evaluate(() => { openAuthModal(); switchAuthTab('login'); });\n  await page.fill('#loginIdentifier', email);"
          if old not in h:
              raise SystemExit('loginCustomer harness anchor not found')
          h=h.replace(old,new,1)
          old_quote="    quote: lastCheckoutQuote ? { total: lastCheckoutQuote.total, items: lastCheckoutQuote.items } : null,"
          new_quote="    quoteTotalText: document.getElementById('checkoutTotal')?.textContent || null,"
          if old_quote not in h:
              raise SystemExit('checkout instrumentation anchor not found')
          h=h.replace(old_quote,new_quote,1)
          old_password="await page.evaluate(async () => auth.signInWithEmailAndPassword('unverified@example.com', PASSWORD));"
          new_password="await page.evaluate(async (password) => auth.signInWithEmailAndPassword('unverified@example.com', password), PASSWORD);"
          if old_password not in h:
              raise SystemExit('unverified customer login harness anchor not found')
          h=h.replace(old_password,new_password,1)
          old_dash="""    const m = await page.evaluate(() => ({ sw: document.documentElement.scrollWidth, iw: innerWidth, active: document.querySelector('#employeeDashboard')?.classList.contains('active') }));
    assert(m.active && m.sw <= m.iw + 2, `Dashboard has no page-level horizontal overflow at ${width}px`, `${m.sw}/${m.iw}`);
"""
          new_dash="""    const m = await page.evaluate(() => {
      const vw = innerWidth;
      const offenders = [...document.querySelectorAll('#employeeDashboard *')].map((el) => {
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        return {
          tag: el.tagName,
          id: el.id,
          cls: String(el.className || '').slice(0, 100),
          text: String(el.textContent || '').trim().replace(/\\s+/g, ' ').slice(0, 80),
          left: Math.round(r.left), right: Math.round(r.right), width: Math.round(r.width),
          scrollWidth: el.scrollWidth, clientWidth: el.clientWidth,
          minWidth: cs.minWidth, widthCss: cs.width, overflowX: cs.overflowX,
        };
      }).filter(x => x.right > vw + 2 || x.left < -2 || x.scrollWidth > x.clientWidth + 2)
        .sort((a,b) => Math.max(b.right-vw, b.scrollWidth-b.clientWidth) - Math.max(a.right-vw, a.scrollWidth-a.clientWidth))
        .slice(0, 20);
      return { sw: document.documentElement.scrollWidth, iw: vw, active: document.querySelector('#employeeDashboard')?.classList.contains('active'), offenders };
    });
    if (width === 360) console.log('DASHBOARD_OVERFLOW', JSON.stringify(m));
    assert(m.active && m.sw <= m.iw + 2, `Dashboard has no page-level horizontal overflow at ${width}px`, `${m.sw}/${m.iw}`);
"""
          if old_dash not in h:
              raise SystemExit('dashboard overflow harness anchor not found')
          p.write_text(h.replace(old_dash,new_dash,1))
          PY
      - name: Start Firebase Emulator Suite
        run: |
          nohup npx firebase emulators:start --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO > /tmp/kem-emulator.log 2>&1 &
          echo $! > /tmp/kem-emulator.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null 2>&1 && curl -fsS http://127.0.0.1:9099/ >/dev/null 2>&1; then
              echo 'Emulators ready on CLI-managed validation namespace'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kem-emulator.log
          exit 1
      - name: Seed isolated emulator data
        env:
          NODE_PATH: ${{ github.workspace }}/functions/node_modules:${{ github.workspace }}/node_modules
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          GCLOUD_PROJECT: demo-kem-validation
        run: node validation/seed.cjs
      - name: Diagnose 360px overflow
        run: node validation/overflow_diagnostic.cjs
      - name: Run real browser and backend smoke tests
        env:
          NODE_PATH: ${{ github.workspace }}/functions/node_modules:${{ github.workspace }}/node_modules
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          GCLOUD_PROJECT: demo-kem-validation
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node validation/smoke.cjs
      - name: Emulator logs on failure
        if: failure()
        run: |
          echo '=== Firebase emulator log ==='
          cat /tmp/kem-emulator.log || true
          echo '=== firebase-debug.log ==='
          cat firebase-debug.log || true
      - name: Restore runtime-only patches and rerun P0/P1 guards
        if: always()
        run: |
          git checkout -- index.html firebase.json functions/index.js validation/smoke.cjs validation/seed.cjs
          rm -f package.json package-lock.json firebase-debug.log database-debug.log ui-debug.log
          rm -rf node_modules functions/node_modules functions/package-lock.json
          node --check functions/index.js
          python3 -m json.tool database.rules.json >/dev/null
          python3 -m json.tool firebase.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess,tempfile,os
          h=Path('index.html').read_text(); b=Path('functions/index.js').read_text(); rules=json.loads(Path('database.rules.json').read_text())['rules']
          blocks=re.findall(r'<script\s+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',h,re.S|re.I)
          assert blocks
          for body in blocks: json.loads(body)
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I):
              if 'application/ld+json' in attrs.lower() or not body.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False);f.write(body);f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          assert h.count("window.addEventListener('popstate'")==1
          assert h.count("document.addEventListener('keydown', event => {")==1
          assert 'exports.revokeEmployeeSession' in b and 'auth.revokeRefreshTokens' in b
          assert 'requireVerifiedCustomer' in b and "paymentMethod !== 'cod'" in b
          assert "db.ref('/').transaction" in b and 'product.stock = currentStock - item.quantity' in b
          assert rules['orders']['.read'] is False and rules['orders']['.write'] is False
          assert rules['employeeRoles']['.read'] is False and rules['coupons']['.read'] is False
          assert 'request.data?.price' not in b
          assert 'exports.getCustomerOrders' in b and 'exports.uploadProductImage' in b
          print('P0/P1 guardrails passed after integration run')
          PY
          git diff --check
          git diff --exit-code 317cf982aa1ae0cb4f39550521b8899dba5f88d3 HEAD -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
