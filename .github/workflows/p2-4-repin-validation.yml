name: P2.4 repin validation
on:
  push:
    branches:
      - agent/p1-final-validation
    paths:
      - .github/workflows/p2-4-repin-validation.yml
permissions:
  contents: write
jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-final-validation
          fetch-depth: 0
      - name: Repin valid P2.4 workflow and keyboard focus harness
        run: |
          python3 validation/repin_p2_4.py
          node --check validation/p2_4_product_detail_targeted.cjs
          git diff --check
          git config user.name "kemeg25-create"
          git config user.email "kem.eg25@gmail.com"
          git add .github/workflows/p2-4-validation.yml validation/p2_4_product_detail_targeted.cjs
          git commit -m "Repin P2.4 validation to amended source"
          git push origin HEAD:agent/p1-final-validation
