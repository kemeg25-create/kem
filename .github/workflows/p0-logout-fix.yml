name: P0 employee logout fix

on:
  push:
    branches:
      - agent/p0-security-commerce

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch employee logout only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          new = """        async function logoutEmployee() {
              const dashboard = document.getElementById('employeeDashboard');
              const mainSite = document.getElementById('mainSite');
              const mainNav = document.getElementById('mainNav');

              // Remove privileged UI and cached admin data immediately.
              currentEmployee = null;
              promotionsUnlocked = false;
              orders = [];
              users = {};
              employeeRoles = {};
              notifications = [];
              unreadNotifications = 0;
              if (dashboard) dashboard.classList.remove('active');
              if (mainSite) mainSite.style.display = 'block';
              if (mainNav) mainNav.style.display = 'flex';
              updateNotificationBadge();

              try {
                  if (auth?.currentUser) {
                      await auth.signOut();
                  }
                  if (auth?.currentUser) {
                      throw new Error('Firebase Authentication session is still active after sign-out.');
                  }
                  currentUser = null;
                  updateAuthButton();
              } catch (error) {
                  console.error('Employee logout failed:', error);
                  alert('Unable to securely sign out. Please try again.');
                  throw error;
              }
          }
          """
          if 'async function logoutEmployee()' in s and 'await auth.signOut();' in s[s.index('async function logoutEmployee()'):s.index('async function logoutEmployee()')+1800]:
              print('Employee logout is already patched; no source change needed.')
          else:
              pattern = re.compile(
                  r'^[ \t]*function logoutEmployee\(\) \{\s*'
                  r'currentEmployee = null;\s*'
                  r'promotionsUnlocked = false;\s*'
                  r"document\.getElementById\('employeeDashboard'\)\.classList\.remove\('active'\);\s*"
                  r"document\.getElementById\('mainSite'\)\.style\.display = 'block';\s*"
                  r"document\.getElementById\('mainNav'\)\.style\.display = 'flex';\s*"
                  r'\}',
                  re.M
              )
              s2, count = pattern.subn(new.rstrip(), s, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one legacy logoutEmployee implementation; found {count}.')
              p.write_text(s2)
              print('Employee logout patched.')
          PY

      - name: Install backend dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check backend syntax
        run: node --check functions/index.js

      - name: Check all inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          html = Path('index.html').read_text()
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          checked = 0
          for block in blocks:
              if not block.strip():
                  continue
              if block.lstrip().startswith('{') and '"@context"' in block:
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                  f.write(block)
                  name = f.name
              try:
                  subprocess.run(['node', '--check', name], check=True)
              finally:
                  os.unlink(name)
              checked += 1
          print(f'Checked {checked} inline JavaScript block(s).')
          PY

      - name: Verify logout and authorization invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          backend = Path('functions/index.js').read_text()
          rules = Path('database.rules.json').read_text()

          start = html.index('async function logoutEmployee()')
          logout = html[start:start+2000]
          for required in [
              'currentEmployee = null;', 'orders = [];', 'users = {};', 'employeeRoles = {};',
              'await auth.signOut();', "throw new Error('Firebase Authentication session is still active after sign-out.');",
              'updateAuthButton();'
          ]:
              assert required in logout, required
          assert logout.index('currentEmployee = null;') < logout.index('await auth.signOut();')
          assert re.search(r'async function logout\(\).*?await auth\.signOut\(\);', html, re.S)

          assert re.search(r'exports\.getAdminData\s*=.*?getEmployeeForRequest\(request,\s*1\)', backend, re.S)
          assert re.search(r'exports\.adminWrite\s*=.*?getEmployeeForRequest\(request,\s*minimumRole\)', backend, re.S)
          assert re.search(r'exports\.updateOrder\s*=.*?getEmployeeForRequest\(request,\s*1\)', backend, re.S)
          assert "if (!request.auth?.uid || !request.auth?.token?.email)" in backend
          assert "throw new HttpsError('unauthenticated'" in backend
          assert 'request.auth.token.email_verified !== true' in backend
          assert '"orders": {\n      ".read": false,\n      ".write": false' in rules
          assert '"employeeRoles": {\n      ".read": false,\n      ".write": false' in rules
          print('Logout and authorization invariants passed.')
          PY

      - name: Verify login and customer auth remain intact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          assert html.count('auth.signInWithEmailAndPassword') >= 2
          assert 'auth.createUserWithEmailAndPassword' in html
          assert 'auth.sendPasswordResetEmail' in html
          assert 'auth.signInWithCredential(googleCredential)' in html
          assert 'firebase.auth.GoogleAuthProvider.credential(response.credential)' in html
          assert 'getEmployeeProfile' in html
          print('Employee re-login and customer authentication entry points remain present.')
          PY

      - name: Diff checks
        run: |
          git diff --check
          git diff -- index.html

      - name: Commit logout fix if needed
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix employee Firebase logout'
          git push origin HEAD:agent/p0-security-commerce

      - name: Verify committed diff hygiene
        run: |
          git diff --check HEAD^ HEAD
          git status --short
