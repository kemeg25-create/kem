name: P1 structured data repair
on:
  push:
    branches:
      - agent/p1-remediation
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair JSON-LD and restore handlers
        run: python3 p1_structured_data_fix.py
      - name: Focused structured-data and P0/P1 checks
        run: |
          python3 p1_verify_structured_data.py
          node --check functions/index.js
          python3 -m json.tool database.rules.json >/dev/null
          python3 -m json.tool firebase.json >/dev/null
          npm --prefix functions install --ignore-scripts --no-audit --no-fund
          npm --prefix functions test --if-present
          git diff --check
      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'Repair JSON-LD and restore dialog history handlers'
          git push origin HEAD:agent/p1-remediation
