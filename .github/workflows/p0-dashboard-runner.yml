name: P0 dashboard regression verify
on:
  push:
    branches:
      - agent/p0-security-commerce
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply dashboard fix
        run: python3 scripts/p0_dashboard_fix.py
      - name: Install backend dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and regression checks
        run: |
          node --check functions/index.js
          python3 -m json.tool database.rules.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          h=Path('index.html').read_text()
          for block in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I):
              if not block.strip() or (block.lstrip().startswith('{') and '"@context"' in block): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False); f.write(block); f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          pos=h.index('async function showDashboard()')
          chunk=h[pos:pos+1500]
          assert 'await loadAdminData();' in chunk
          assert chunk.index('await loadAdminData();') < chunk.index("document.getElementById('employeeDashboard').classList.add('active')")
          assert "alert('Unable to load the employee dashboard securely. Please try again.');" in chunk
          login=h[h.index('async function verifyPasscode()'):][:1800]
          assert 'await showDashboard();' in login
          print('dashboard secure-load regression checks passed')
          PY
          git diff --check
      - name: Commit dashboard fix
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load secure data before employee dashboard'
          git push origin HEAD:agent/p0-security-commerce
      - name: Verify committed diff
        run: git diff --check HEAD^ HEAD
