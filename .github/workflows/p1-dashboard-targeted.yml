name: P1 targeted dashboard validation
on:
  push:
    branches:
      - agent/p1-dashboard-targeted
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify validation branch production files are unchanged
        run: |
          git merge-base --is-ancestor 317cf982aa1ae0cb4f39550521b8899dba5f88d3 HEAD
          git diff --exit-code 317cf982aa1ae0cb4f39550521b8899dba5f88d3 HEAD -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
      - name: Install emulator and Chromium tooling
        run: |
          npm --prefix functions install --ignore-scripts --no-audit --no-fund
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false firebase-tools playwright >/dev/null
          npx playwright install --with-deps chromium
      - name: Prepare isolated validation runtime
        run: |
          python3 validation/prepare_emulator.py
          python3 validation/patch_functions_runtime.py
          python3 -m json.tool firebase.json >/dev/null
          node --check functions/index.js
          node --check validation/dashboard_targeted.cjs
      - name: Run targeted employee/dashboard browser validation
        env:
          NODE_PATH: ${{ github.workspace }}/functions/node_modules:${{ github.workspace }}/node_modules
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          GCLOUD_PROJECT: demo-kem-validation
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "[$(date -Ins)] Starting Firebase emulators under emulators:exec"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 90s node validation/dashboard_targeted.cjs"
          echo "[$(date -Ins)] emulators:exec returned cleanly"
      - name: Process diagnostics on failure
        if: failure()
        run: |
          echo '=== process tree ==='
          ps -ef --forest || true
          echo '=== listening sockets ==='
          ss -lptn || true
          echo '=== firebase debug tail ==='
          tail -n 250 firebase-debug.log || true
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-targeted-failure
          path: validation/dashboard-targeted-failure.png
          if-no-files-found: ignore
      - name: Restore runtime-only patches and verify diff
        if: always()
        run: |
          git checkout -- index.html firebase.json functions/index.js
          rm -f package.json package-lock.json firebase-debug.log database-debug.log ui-debug.log
          rm -rf node_modules functions/node_modules functions/package-lock.json
          node --check functions/index.js
          python3 -m json.tool database.rules.json >/dev/null
          python3 -m json.tool firebase.json >/dev/null
          git diff --check
          git diff --exit-code 317cf982aa1ae0cb4f39550521b8899dba5f88d3 HEAD -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
