name: P1 display logo optimization
on:
  push:
    branches: [agent/p1-remediation]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
      - name: Generate exact resized display logo
        run: |
          convert "icon enhanced.png" -resize 240x240 -strip -define png:compression-level=9 logo-240.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          count=s.count('src="icon enhanced.png"')
          if count < 1:
              raise SystemExit('No displayed source-logo reference found')
          s=s.replace('src="icon enhanced.png"','src="logo-240.png"')
          p.write_text(s)
          print('display logo refs replaced:', count)
          PY
      - name: Verify asset and source integrity
        run: |
          test -s logo-240.png
          test $(wc -c < logo-240.png) -lt 300000
          identify logo-240.png
          grep -q 'src="logo-240.png"' index.html
          ! grep -q 'src="icon enhanced.png"' index.html
          grep -q 'https://buykem.com/icon%20enhanced.png' index.html
          node --check functions/index.js
          git diff --check
      - name: Commit display asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html logo-240.png
          git commit -m 'Optimize displayed KEM logo delivery'
          git push origin HEAD:agent/p1-remediation
