name: Temporary P0 patch runner

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  run-p0:
    if: github.event.issue.title == '[automation] run P0 patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out P0 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-security-commerce
          fetch-depth: 0

      - name: Tighten backend employee verification and legacy credential cleanup
        shell: python
        run: |
          from pathlib import Path
          p = Path('functions/index.js')
          s = p.read_text(encoding='utf-8')

          old = """  if (!request.auth?.uid || !request.auth?.token?.email) {
            throw new HttpsError('unauthenticated', 'Employee authentication is required.');
          }

          const email = String(request.auth.token.email).toLowerCase();"""
          new = """  if (!request.auth?.uid || !request.auth?.token?.email) {
            throw new HttpsError('unauthenticated', 'Employee authentication is required.');
          }
          if (request.auth.token.email_verified !== true) {
            throw new HttpsError('permission-denied', 'A verified employee email is required.');
          }

          const email = String(request.auth.token.email).toLowerCase();"""
          if old not in s:
              raise SystemExit('employee auth verification patch target not found')
          s = s.replace(old, new, 1)

          old = """  if (!employee || !ROLE_LEVEL[employee.role] || ROLE_LEVEL[employee.role] < minimumRole) {
            throw new HttpsError('permission-denied', 'You do not have permission to perform this action.');
          }

          return {"""
          new = """  if (!employee || !ROLE_LEVEL[employee.role] || ROLE_LEVEL[employee.role] < minimumRole) {
            throw new HttpsError('permission-denied', 'You do not have permission to perform this action.');
          }

          if (Object.prototype.hasOwnProperty.call(employee, 'password')) {
            await snap.ref.child('password').remove();
          }

          return {"""
          if old not in s:
              raise SystemExit('legacy employee password cleanup target not found')
          s = s.replace(old, new, 1)

          old = """  const root = snap.val() || {};

          const response = {"""
          new = """  const root = snap.val() || {};

          if (ROLE_LEVEL[employee.role] >= 5) {
            const cleanup = {};
            for (const [key, value] of Object.entries(root.employeeRoles || {})) {
              if (value && Object.prototype.hasOwnProperty.call(value, 'password')) cleanup[`employeeRoles/${key}/password`] = null;
            }
            for (const [key, value] of Object.entries(root.users || {})) {
              if (value && Object.prototype.hasOwnProperty.call(value, 'password')) cleanup[`users/${key}/password`] = null;
            }
            if (Object.keys(cleanup).length) await db.ref('/').update(cleanup);
          }

          const response = {"""
          if old not in s:
              raise SystemExit('legacy customer password cleanup target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Apply storefront P0 patch
        run: python scripts/apply-p0.py

      - name: Verify backend syntax
        run: node --check functions/index.js

      - name: Verify inline JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, tempfile, os

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.capture=False; self.buf=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag != 'script': return
                  attrs = dict(attrs)
                  if attrs.get('src') or attrs.get('type') == 'application/ld+json': return
                  self.capture=True; self.buf=[]
              def handle_data(self, data):
                  if self.capture: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.capture:
                      self.scripts.append(''.join(self.buf)); self.capture=False

          parser=Scripts(); parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if not parser.scripts: raise SystemExit('No inline scripts found')
          for i, script in enumerate(parser.scripts):
              fd, name = tempfile.mkstemp(suffix='.js'); os.close(fd)
              Path(name).write_text(script, encoding='utf-8')
              result=subprocess.run(['node','--check',name],text=True,capture_output=True)
              if result.returncode:
                  print(result.stderr); raise SystemExit(f'Inline script {i} has invalid syntax')
          print(f'Validated {len(parser.scripts)} inline JavaScript block(s).')

      - name: Verify P0 invariants
        shell: python
        run: |
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          backend=Path('functions/index.js').read_text(encoding='utf-8')
          rules=Path('database.rules.json').read_text(encoding='utf-8')
          forbidden=["Your current password is:","password: '270913'","correctPin = '1987'","passcode === '200616'","pin !== '1978'","Authorization': `Bearer ${fawaterakConfig.apiKey}`","saveToFirebase('orders', orders);","saveToFirebase('users', users);"]
          for item in forbidden:
              if item in html: raise SystemExit(f'Forbidden P0 pattern remains: {item}')
          required=["auth.signInWithEmailAndPassword","auth.createUserWithEmailAndPassword","auth.sendPasswordResetEmail","firebase.auth.GoogleAuthProvider.credential","cloudFunctions.httpsCallable('createOrder')","cloudFunctions.httpsCallable('quoteOrder')","cloudFunctions.httpsCallable('getEmployeeProfile')","escapeHTML(notif.message)"]
          for item in required:
              if item not in html: raise SystemExit(f'Missing secure storefront control: {item}')
          for item in ["request.auth.token.email_verified !== true","db.ref('/').transaction","paymentMethod !== 'cod'","exports.quoteOrder","exports.createOrder","exports.adminWrite","exports.updateOrder","cleanup[`users/${key}/password`] = null"]:
              if item not in backend: raise SystemExit(f'Missing secure backend control: {item}')
          if '"orders": {\n      ".read": false,\n      ".write": false' not in rules: raise SystemExit('Orders rules not locked down')
          if '"employeeRoles": {\n      ".read": false,\n      ".write": false' not in rules: raise SystemExit('Employee rules not locked down')
          print('P0 invariants verified')

      - name: Verify diff and commit branch
        run: |
          git diff --check
          git config user.name "KEM Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html functions/index.js
          git diff --cached --check
          git commit -m "Fix P0 security and commerce integrity"
          git push origin agent/p0-security-commerce
