name: P0 follow-up runner
on:
  push:
    branches:
      - agent/p0-security-commerce
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply follow-up hardening
        run: python3 scripts/p0_followup.py
      - name: Install backend dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check functions/index.js
          python3 -m json.tool database.rules.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          h=Path('index.html').read_text()
          for block in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I):
              if not block.strip() or (block.lstrip().startswith('{') and '"@context"' in block): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False); f.write(block); f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          PY
      - name: Final P0 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          b=Path('functions/index.js').read_text(); h=Path('index.html').read_text(); r=json.loads(Path('database.rules.json').read_text())['rules']
          assert 'This employee session has been revoked' in b
          assert 'auth.revokeRefreshTokens(employee.uid)' in b
          assert "httpsCallable('revokeEmployeeSession')" in h[h.index('async function logoutEmployee()'):][:3500]
          assert 'Coupon validation requires a verified account.' in b
          q=b[b.index('exports.quoteOrder'):b.index('exports.createOrder')]
          assert 'await requireVerifiedCustomer(request)' in q
          create=b[b.index('exports.createOrder'):]
          assert 'await requireVerifiedCustomer(request)' in create[:1200]
          assert 'customerUid: authenticatedCustomer.uid' in create
          assert 'orderRequestTime - lastOrderAt < 30000' in create
          assert 'pendingOrders >= 5' in create
          assert "paymentMethod !== 'cod'" in create
          assert "db.ref('/').transaction" in create
          assert 'root.counters.orderNumbers[year]' in create
          assert 'product.stock = currentStock - item.quantity' in create
          assert 'root.coupons[key].used' in create
          assert 'if (idNumber < 1) continue;' in b
          assert r['coupons']['.read'] is False
          assert r['security']['.read'] is False and r['security']['.write'] is False
          assert "readPublicPath('coupons')" not in h
          assert 'const coupon = coupons.find(c => c.code === code' not in h
          assert 'request.data?.totals' not in create and 'requested?.price' not in b
          assert 'if (ROLE_LEVEL[employee.role] >= 5) {\n    for (const [key, value] of Object.entries(root.users || {}))' in b
          u=r['users']['$uid']
          assert u['.read']=='auth != null && auth.uid === $uid' and u['.write']=='auth != null && auth.uid === $uid'
          assert 'auth.token.email' in u['email']['.validate']
          assert u['orderHistory']['.validate']=='newData.val() === data.val()'
          assert u['$other']['.validate'] is False
          assert r['orders']['.read'] is False and r['orders']['.write'] is False
          assert r['employeeRoles']['.read'] is False and r['employeeRoles']['.write'] is False
          assert h.count('auth.signInWithEmailAndPassword') >= 2
          assert 'auth.createUserWithEmailAndPassword' in h and 'auth.sendPasswordResetEmail' in h
          assert 'auth.signInWithCredential(googleCredential)' in h
          assert re.search(r'async function logoutUser\(\).*?await auth\.signOut\(\);',h,re.S)
          assert 'escapeHTML(order.customer)' in h and 'escapeHTML(item.product)' in h
          assert 'escapeHTML(notif.message)' in h and 'escapeHTML(notif.title)' in h
          print('Final P0 invariants passed')
          PY
      - name: Diff check
        run: |
          git diff --check
          git diff --stat
      - name: Commit follow-up production changes
        run: |
          if git diff --quiet -- functions/index.js database.rules.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/index.js database.rules.json
          git commit -m 'Close remaining P0 abuse paths'
          git push origin HEAD:agent/p0-security-commerce
      - name: Verify committed diff
        run: git diff --check HEAD^ HEAD
