name: Verify P0 regression fix

on:
  push:
    branches:
      - agent/p0-security-commerce
    paths:
      - .github/workflows/p0-regression.yml

permissions:
  contents: write

jobs:
  verify-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-security-commerce
          fetch-depth: 0

      - name: Apply regression fix
        run: python scripts/fix-p0-regressions.py

      - name: Verify backend syntax
        run: node --check functions/index.js

      - name: Verify inline JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, tempfile, os
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.capture=False; self.buf=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag != 'script': return
                  attrs=dict(attrs)
                  if attrs.get('src') or attrs.get('type') == 'application/ld+json': return
                  self.capture=True; self.buf=[]
              def handle_data(self, data):
                  if self.capture: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.capture:
                      self.scripts.append(''.join(self.buf)); self.capture=False
          parser=Scripts(); parser.feed(Path('index.html').read_text(encoding='utf-8'))
          for i, script in enumerate(parser.scripts):
              fd,name=tempfile.mkstemp(suffix='.js'); os.close(fd); Path(name).write_text(script,encoding='utf-8')
              result=subprocess.run(['node','--check',name],text=True,capture_output=True)
              if result.returncode:
                  print(result.stderr); raise SystemExit(f'Inline script {i} invalid')
          print(f'Validated {len(parser.scripts)} inline JavaScript block(s).')

      - name: Verify P0 invariants and regression
        shell: python
        run: |
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          forbidden=[
            "Your current password is:", "password: '270913'", "correctPin = '1987'",
            "passcode === '200616'", "pin !== '1978'", "saveToFirebase('orders', orders);",
            "saveToFirebase('users', users);", "const userData = users[currentUser.email];"
          ]
          for item in forbidden:
              if item in html: raise SystemExit(f'Forbidden P0 pattern remains: {item}')
          required=[
            "cloudFunctions.httpsCallable('createOrder')", "cloudFunctions.httpsCallable('quoteOrder')",
            "cloudFunctions.httpsCallable('getEmployeeProfile')", "auth.sendPasswordResetEmail",
            "firebase.auth.GoogleAuthProvider.credential", "escapeHTML(notif.message)",
            "const userData = currentUser?.uid ? users[currentUser.uid] : null;"
          ]
          for item in required:
              if item not in html: raise SystemExit(f'Required control missing: {item}')
          print('P0 regression and security invariants verified.')

      - name: Verify diff and commit
        run: |
          git diff --check
          git config user.name "KEM Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Fix secure customer profile lookup"
          git push origin agent/p0-security-commerce
