name: Fix P2.1 validation imports
on:
  push:
    branches:
      - agent/p1-final-validation
    paths:
      - .github/workflows/fix-p2-1-validation-imports.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-final-validation
      - name: Correct Firebase Admin package imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('validation/p2_1_header_targeted.cjs')
          s=p.read_text()
          old1="require('../functions/node_modules/firebase-admin/app')"
          old2="require('../functions/node_modules/firebase-admin/database')"
          assert s.count(old1)==1 and s.count(old2)==1
          s=s.replace(old1,"require('firebase-admin/app')",1).replace(old2,"require('firebase-admin/database')",1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- validation/p2_1_header_targeted.cjs
      - name: Commit corrected validation imports
        run: |
          git config user.name 'KEM validation agent'
          git config user.email 'actions@users.noreply.github.com'
          git add validation/p2_1_header_targeted.cjs
          git commit -m 'Fix P2.1 validation Firebase imports'
          git push origin HEAD:agent/p1-final-validation
