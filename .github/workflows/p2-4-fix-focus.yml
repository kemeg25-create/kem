name: P2.4 fix product detail focus
on:
  push:
    branches:
      - agent/p1-final-validation
    paths:
      - .github/workflows/p2-4-fix-focus.yml
permissions:
  contents: write
jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-visual-ux
          fetch-depth: 0
      - name: Verify exact P2.4 candidate
        run: |
          test "$(git rev-parse HEAD)" = "053968b477852c14569998ef9f5e1eb575d44437"
          test "$(git rev-parse HEAD^)" = "6c5a6b23cc438a72b39027b65770980589d1cc7d"
          test "$(git diff --name-only HEAD^ HEAD)" = "index.html"
          test -z "$(git status --porcelain)"
      - name: Restore visible product detail keyboard focus and amend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); h=p.read_text()
          anchor='''        @media (max-width: 1023px) {\n'''
          assert h.count(anchor) >= 1
          rule='''        #productDetailModal .product-detail-back:focus-visible,\n        #productDetailModal .product-detail-close:focus-visible,\n        #productDetailModal .product-gallery-thumb:focus-visible,\n        #productDetailModal .variant-option:focus-visible,\n        #productDetailModal .quantity-selector button:focus-visible,\n        #productDetailModal .add-to-cart-btn:focus-visible,\n        #productDetailModal .recommended-product:focus-visible {\n            outline: 3px solid var(--color-kem-pink);\n            outline-offset: 3px;\n        }\n\n'''
          pos=h.index(anchor, h.index('/* P2.4 — PRODUCT DETAIL */'))
          h=h[:pos]+rule+h[pos:]
          p.write_text(h)
          PY
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          python3 - <<'PY' > /tmp/index-inline.js
          from pathlib import Path
          import re
          h=Path('index.html').read_text()
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I):
              if 'application/ld+json' in attrs.lower() or not body.strip(): continue
              print(body)
          PY
          node --check /tmp/index-inline.js
          grep -q '#productDetailModal .add-to-cart-btn:focus-visible' index.html
          git config user.name "kemeg25-create"
          git config user.email "kem.eg25@gmail.com"
          git add index.html
          git commit --amend --no-edit
          test "$(git rev-parse HEAD^)" = "6c5a6b23cc438a72b39027b65770980589d1cc7d"
          test "$(git diff --name-only HEAD^ HEAD)" = "index.html"
          git push --force-with-lease origin HEAD:agent/p2-visual-ux
