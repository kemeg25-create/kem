name: P2.6 P0 P1 diagnostic replay

on:
  push:
    branches: [agent/p1-final-validation]
    paths:
      - .github/workflows/p2-6-p01-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Load exact committed production source
        run: |
          set -euo pipefail
          P25=eadc7b2016f3bd1fb5b531cc547cac00686453d3
          P26=9aac91d32ed380c231d8bf2985eabd583817e9ae
          git fetch origin agent/p2-visual-ux
          test "$(git rev-parse origin/agent/p2-visual-ux)" = "$P26"
          test "$(git rev-parse $P26^)" = "$P25"
          test "$(git rev-list --count $P25..$P26)" = "1"
          test "$(git diff --name-only $P25 $P26)" = "index.html"
          git checkout "$P26" -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
      - name: Install emulator and Chromium tooling
        run: |
          npm --prefix functions install --ignore-scripts --no-audit --no-fund >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false firebase-tools playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Prepare emulator wiring and assert no app behavior patch
        run: |
          set -euo pipefail
          P26=9aac91d32ed380c231d8bf2985eabd583817e9ae
          python3 validation/prepare_emulator.py >/dev/null
          python3 validation/patch_functions_runtime.py >/dev/null
          python3 validation/full_runtime_patch.py >/dev/null
          git diff -U0 "$P26" -- index.html functions/index.js > /tmp/runtime-app.diff || true
          if grep -E 'P2\.6|authModal|accountModal|loginForm|signupForm|handleLogin|openAccountModal|logoutUser|openCart|cartPage|checkoutPage|quoteOrder|createOrder|P2\.5|P2\.4|P2\.3|P2\.2|P2\.1|employeeModal|logoutEmployee' /tmp/runtime-app.diff; then
            echo 'FAIL: runtime preparation altered committed application behavior'
            exit 1
          fi
          echo 'DIAG_RUNTIME_APP_PATCH=none'
      - name: Replay 79-assertion integration and print only diagnostics
        env:
          NODE_PATH: ${{ github.workspace }}/functions/node_modules:${{ github.workspace }}/node_modules
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          GCLOUD_PROJECT: demo-kem-validation
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          set +e
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=ERROR "node validation/seed.cjs && timeout 200s node validation/smoke.cjs" > /tmp/p01.log 2>&1
          rc=$?
          set -e
          echo '--- P0/P1 DIAGNOSTIC ---'
          grep -E 'FAIL:|SMOKE_RESULT|TimeoutError|locator\.|page\.|Error:|Assertion|DIAG_' /tmp/p01.log || true
          echo "DIAG_EXIT_CODE=$rc"
          exit "$rc"
