name: P0 final hardening
on:
  push:
    branches: [agent/p0-security-commerce]
permissions:
  contents: write
jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}

      - name: Apply narrowly scoped P0 hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          # ---------- backend ----------
          p = Path('functions/index.js')
          s = p.read_text()

          marker = """function cleanPhone(value) {
            return cleanText(value, 30).replace(/[^0-9+()\\-\\s]/g, '');
          }
          """
          helpers = marker + """

          function cleanMarkupText(value, maxLength = 500) {
            return cleanText(value, maxLength).replace(/[<>\"']/g, '');
          }

          function cleanImageSource(value) {
            const source = cleanText(value, 5 * 1024 * 1024);
            if (!source) return '';
            if (/^https:\/\/[^\\s\"'<>]+$/i.test(source)) return source;
            if (/^data:image\/(?:png|jpe?g|webp|gif);base64,[a-z0-9+/=]+$/i.test(source)) return source;
            if (/^[a-z0-9_./() -]+\.(?:png|jpe?g|webp|gif)(?:\?[^\"'<>]*)?$/i.test(source)) return source;
            return '';
          }

          function sanitizeNestedAdminData(value, key = '', depth = 0) {
            if (depth > 8) return null;
            if (Array.isArray(value)) return value.map((item) => sanitizeNestedAdminData(item, key, depth + 1));
            if (value && typeof value === 'object') {
              const result = {};
              for (const [childKey, childValue] of Object.entries(value)) {
                result[childKey] = sanitizeNestedAdminData(childValue, childKey, depth + 1);
              }
              return result;
            }
            if (typeof value !== 'string') return value;
            const lowerKey = String(key).toLowerCase();
            if (['image', 'icon', 'iconurl'].includes(lowerKey)) return cleanImageSource(value);
            if (['url', 'link'].includes(lowerKey)) {
              const url = cleanText(value, 2048).replace(/[<>\"']/g, '');
              return /^https:\/\//i.test(url) ? url : '';
            }
            return cleanMarkupText(value, 5000);
          }

          function sanitizeProducts(value) {
            const isArray = Array.isArray(value);
            const entries = isArray ? value.map((item, index) => [String(index), item]) : Object.entries(value || {});
            const result = isArray ? [] : {};
            for (const [key, product] of entries) {
              if (!product || typeof product !== 'object') continue;
              const idNumber = Math.floor(normalizeNumber(product.id));
              const safe = {
                id: idNumber > 0 ? idNumber : cleanMarkupText(product.id, 80),
                name: cleanMarkupText(product.name, 120),
                category: cleanMarkupText(product.category, 100),
                description: cleanMarkupText(product.description, 2000),
                price: Math.max(0, normalizeNumber(product.price)),
                stock: Math.max(0, Math.floor(normalizeNumber(product.stock))),
                status: product.status === 'Active' ? 'Active' : 'Inactive',
                image: cleanImageSource(product.image)
              };
              if (isArray) result.push(safe); else result[key] = safe;
            }
            return result;
          }

          function sanitizeCoupons(value) {
            const isArray = Array.isArray(value);
            const entries = isArray ? value.map((item, index) => [String(index), item]) : Object.entries(value || {});
            const result = isArray ? [] : {};
            for (const [key, coupon] of entries) {
              if (!coupon || typeof coupon !== 'object') continue;
              const safe = {
                id: Math.max(0, Math.floor(normalizeNumber(coupon.id))),
                code: cleanText(coupon.code, 50).toUpperCase().replace(/[^A-Z0-9_-]/g, ''),
                type: coupon.type === 'percentage' ? 'percentage' : 'fixed',
                value: Math.max(0, normalizeNumber(coupon.value)),
                minOrder: Math.max(0, normalizeNumber(coupon.minOrder)),
                limit: Math.max(0, Math.floor(normalizeNumber(coupon.limit))),
                used: Math.max(0, Math.floor(normalizeNumber(coupon.used))),
                status: coupon.status === 'active' ? 'active' : 'inactive'
              };
              if (isArray) result.push(safe); else result[key] = safe;
            }
            return result;
          }

          async function requireVerifiedCustomer(request) {
            if (!request.auth?.uid || !request.auth?.token?.email) {
              throw new HttpsError('unauthenticated', 'Sign in before placing an order.');
            }
            if (request.auth.token.email_verified !== true) {
              throw new HttpsError('permission-denied', 'Verify your email before placing an order.');
            }
            return {
              uid: request.auth.uid,
              email: cleanEmail(request.auth.token.email)
            };
          }
          """
          if 'function cleanMarkupText(' not in s:
            if marker not in s: raise SystemExit('cleanPhone marker missing')
            s = s.replace(marker, helpers, 1)

          employee_auth_marker = """  if (request.auth.token.email_verified !== true) {
            throw new HttpsError('permission-denied', 'A verified employee email is required.');
          }

          const email = String(request.auth.token.email).toLowerCase();
          """
          employee_auth_new = """  if (request.auth.token.email_verified !== true) {
            throw new HttpsError('permission-denied', 'A verified employee email is required.');
          }

          const userRecord = await auth.getUser(request.auth.uid);
          const tokensValidAfterMs = userRecord.tokensValidAfterTime ? Date.parse(userRecord.tokensValidAfterTime) : 0;
          const authTimeMs = Math.max(0, normalizeNumber(request.auth.token.auth_time)) * 1000;
          if (tokensValidAfterMs && authTimeMs < tokensValidAfterMs) {
            throw new HttpsError('unauthenticated', 'This employee session has been revoked. Sign in again.');
          }

          const email = String(request.auth.token.email).toLowerCase();
          """
          if 'This employee session has been revoked' not in s:
            if employee_auth_marker not in s: raise SystemExit('employee auth marker missing')
            s = s.replace(employee_auth_marker, employee_auth_new, 1)

          profile_marker = """exports.getEmployeeProfile = onCall(async (request) => {
            return getEmployeeForRequest(request, 1);
          });
          """
          profile_new = profile_marker + """

          exports.revokeEmployeeSession = onCall(async (request) => {
            const employee = await getEmployeeForRequest(request, 1);
            await auth.revokeRefreshTokens(employee.uid);
            return { ok: true };
          });
          """
          if 'exports.revokeEmployeeSession' not in s:
            if profile_marker not in s: raise SystemExit('profile export marker missing')
            s = s.replace(profile_marker, profile_new, 1)

          response_marker = """  const response = {
            orders: normalizeList(root.orders),
            employeeRoles: {},
            users: {}
          };
          """
          response_new = """  const response = {
            orders: normalizeList(root.orders),
            employeeRoles: {},
            users: {},
            coupons: []
          };
          """
          if response_marker in s:
            s = s.replace(response_marker, response_new, 1)

          role_block_marker = """  if (ROLE_LEVEL[employee.role] >= 5) {
            for (const [key, value] of Object.entries(root.employeeRoles || {})) {
              response.employeeRoles[key] = {
                email: cleanText(value.email, 254),
                name: cleanText(value.name, 100),
                role: value.role,
                specialAccess: value.specialAccess || {}
              };
            }
          }

          for (const [key, value] of Object.entries(root.users || {})) {
          """
          role_block_new = """  if (ROLE_LEVEL[employee.role] >= 5) {
            for (const [key, value] of Object.entries(root.employeeRoles || {})) {
              response.employeeRoles[key] = {
                email: cleanText(value.email, 254),
                name: cleanText(value.name, 100),
                role: value.role,
                specialAccess: value.specialAccess || {}
              };
            }
          }

          if (ROLE_LEVEL[employee.role] >= 3 || employee.specialAccess?.promotions) {
            response.coupons = normalizeList(sanitizeCoupons(root.coupons));
          }

          for (const [key, value] of Object.entries(root.users || {})) {
          """
          if 'response.coupons = normalizeList(sanitizeCoupons' not in s:
            if role_block_marker not in s: raise SystemExit('admin response role marker missing')
            s = s.replace(role_block_marker, role_block_new, 1)

          admin_auth_marker = """  const minimumRole = permissions[path];
            if (!minimumRole) throw new HttpsError('permission-denied', 'This data path cannot be written from the client.');
            await getEmployeeForRequest(request, minimumRole);

            let dataToSave = data;
          """
          admin_auth_new = """  const minimumRole = permissions[path];
            if (!minimumRole) throw new HttpsError('permission-denied', 'This data path cannot be written from the client.');
            const employee = await getEmployeeForRequest(request, 1);
            const roleLevel = ROLE_LEVEL[employee.role] || 0;
            const specialAllowed = ['announcements', 'coupons', 'productDiscounts', 'orderDiscounts'].includes(path) && employee.specialAccess?.promotions;
            const settingsAllowed = ['categories', 'storeSettings', 'paymentMethods', 'socialLinks'].includes(path) && employee.specialAccess?.settings;
            if (roleLevel < minimumRole && !specialAllowed && !settingsAllowed) {
              throw new HttpsError('permission-denied', 'You do not have permission to modify this data.');
            }

            let dataToSave = data;
            if (path === 'products') dataToSave = sanitizeProducts(data);
            else if (path === 'coupons') dataToSave = sanitizeCoupons(data);
            else if (path !== 'employeeRoles') dataToSave = sanitizeNestedAdminData(data);
          """
          if 'const specialAllowed =' not in s:
            if admin_auth_marker not in s: raise SystemExit('admin auth marker missing')
            s = s.replace(admin_auth_marker, admin_auth_new, 1)

          s = s.replace("const allowedStatuses = new Set(['pending', 'paid', 'fulfilled', 'cancelled']);",
                        "const allowedStatuses = new Set(['pending', 'processing', 'shipped', 'delivered', 'paid', 'fulfilled', 'cancelled']);")

          create_marker = """exports.createOrder = onCall(async (request) => {
            const paymentMethod = cleanText(request.data?.paymentMethod, 40).toLowerCase();
          """
          create_new = """exports.createOrder = onCall(async (request) => {
            const authenticatedCustomer = await requireVerifiedCustomer(request);
            const paymentMethod = cleanText(request.data?.paymentMethod, 40).toLowerCase();
          """
          if 'const authenticatedCustomer = await requireVerifiedCustomer(request);' not in s:
            if create_marker not in s: raise SystemExit('createOrder marker missing')
            s = s.replace(create_marker, create_new, 1)

          customer_marker = """  const customer = {
            name: cleanText(request.data?.customer?.name, 120),
            email: cleanEmail(request.data?.customer?.email),
          """
          customer_new = """  const submittedEmail = cleanEmail(request.data?.customer?.email);
            if (submittedEmail !== authenticatedCustomer.email) {
              throw new HttpsError('permission-denied', 'Order email must match the authenticated account.');
            }

            const customer = {
            name: cleanText(request.data?.customer?.name, 120),
            email: authenticatedCustomer.email,
          """
          if 'Order email must match the authenticated account.' not in s:
            if customer_marker not in s: raise SystemExit('customer marker missing')
            s = s.replace(customer_marker, customer_new, 1)

          # Ensure user history always binds to the authenticated uid, not any optional auth state.
          old_user_block = """    if (request.auth?.uid) {
              root.users = root.users || {};
              const uid = request.auth.uid;
              const existing = root.users[uid] || {};
          """
          new_user_block = """    {
              root.users = root.users || {};
              const uid = authenticatedCustomer.uid;
              const existing = root.users[uid] || {};
          """
          if old_user_block in s:
            s = s.replace(old_user_block, new_user_block, 1)

          p.write_text(s)

          # ---------- database rules ----------
          rp = Path('database.rules.json')
          rules = json.loads(rp.read_text())
          rr = rules['rules']
          rr['coupons']['.read'] = False
          u = rr['users']['$uid']
          u['email'] = {'.validate': "newData.isString() && newData.val() === auth.token.email"}
          u['name'] = {'.validate': "!newData.exists() || (newData.isString() && newData.val().length <= 120)"}
          u['phone'] = {'.validate': "!newData.exists() || (newData.isString() && newData.val().length <= 30)"}
          u['picture'] = {'.validate': "!newData.exists() || (newData.isString() && newData.val().length <= 2048)"}
          u['googleId'] = {'.validate': "!newData.exists() || (newData.isString() && newData.val().length <= 200)"}
          u['savedAddresses'] = {'.validate': "!newData.exists() || newData.hasChildren()"}
          u['orderHistory'] = {'.validate': "newData.val() === data.val()"}
          u['registeredDate'] = {'.validate': "!data.exists() || newData.val() === data.val()"}
          u['lastLogin'] = {'.validate': "!newData.exists() || (newData.isString() && newData.val().length <= 40)"}
          u['$other'] = {'.validate': False}
          rp.write_text(json.dumps(rules, indent=2) + '\n')

          # ---------- frontend ----------
          hp = Path('index.html')
          h = hp.read_text()

          # Coupons are no longer public storefront data.
          h = h.replace('const [productsData, categoriesData, announcementsData, couponsData, productDiscountsData,\n                orderDiscountsData, storeSettingsData, paymentMethodsData, socialLinksData] = await Promise.all([',
                        'const [productsData, categoriesData, announcementsData, productDiscountsData,\n                orderDiscountsData, storeSettingsData, paymentMethodsData, socialLinksData] = await Promise.all([')
          h = h.replace("                readPublicPath('coupons'),\n", '', 1)
          h = h.replace('            if (couponsData) coupons = firebaseList(couponsData);\n', '', 1)
          h = h.replace("                ['coupons', data => { coupons = firebaseList(data); }],\n", '', 1)

          # Secure admin data supplies coupon records only to authorized promotions users.
          load_admin_old = """            orders = firebaseList(response.data.orders);
            users = response.data.users || {};
          """
          load_admin_new = """            orders = firebaseList(response.data.orders);
            users = response.data.users || {};
            if (Array.isArray(response.data.coupons)) coupons = response.data.coupons;
          """
          if 'if (Array.isArray(response.data.coupons)) coupons = response.data.coupons;' not in h:
            if load_admin_old not in h: raise SystemExit('loadAdminData marker missing')
            h = h.replace(load_admin_old, load_admin_new, 1)

          # Validate coupon code through the server; never enumerate client-side coupon records.
          coupon_pattern = re.compile(r'^[ \t]*function applyCouponCode\(\) \{.*?^[ \t]*\}\n\n[ \t]*function removeCouponCode', re.M | re.S)
          coupon_matches = list(coupon_pattern.finditer(h))
          if len(coupon_matches) != 1: raise SystemExit(f'applyCouponCode target count={len(coupon_matches)}')
          coupon_new = """        async function applyCouponCode() {
            const code = document.getElementById('couponInput').value.trim().toUpperCase();
            if (!code) return;
            if (!auth?.currentUser) {
                alert('Please sign in and verify your email before applying a coupon.');
                openAuthModal();
                return;
            }
            try {
                await auth.currentUser.reload();
                await auth.currentUser.getIdToken(true);
                if (!auth.currentUser.emailVerified) {
                    alert('Please verify your email before applying a coupon.');
                    return;
                }
                const quoteOrder = cloudFunctions.httpsCallable('quoteOrder');
                const response = await quoteOrder({
                    items: cart.map(item => ({ id: item.id, quantity: item.quantity })),
                    couponCode: code
                });
                if (!response.data.coupon) throw new Error('Invalid coupon code.');
                appliedCoupon = {
                    code: response.data.coupon,
                    type: 'fixed',
                    value: Number(response.data.couponDiscount) || 0,
                    minOrder: 0,
                    serverValidated: true
                };
                renderCart();
            } catch (error) {
                console.error('Coupon validation failed:', error);
                alert(error?.message || 'Invalid coupon code.');
            }
        }

        function removeCouponCode"""
          h = h[:coupon_matches[0].start()] + coupon_new + h[coupon_matches[0].end():]

          # Quantity changes invalidate the server-derived coupon preview; customer can reapply it.
          uq_marker = """        function updateCartQuantity(index, change) {
            const item = cart[index];
          """
          uq_new = """        function updateCartQuantity(index, change) {
            const item = cart[index];
            if (appliedCoupon) appliedCoupon = null;
          """
          if uq_marker in h and uq_new not in h:
            h = h.replace(uq_marker, uq_new, 1)

          # Verified Firebase account is required before a stock-affecting COD order is attempted.
          place_marker = """        async function placeOrder() {
            const form = document.getElementById('checkoutForm');
          """
          place_new = """        async function placeOrder() {
            if (!auth?.currentUser) {
                alert('Please sign in before placing an order.');
                openAuthModal();
                return;
            }
            await auth.currentUser.reload();
            await auth.currentUser.getIdToken(true);
            if (!auth.currentUser.emailVerified) {
                alert('Please verify your email before placing an order.');
                return;
            }

            const form = document.getElementById('checkoutForm');
          """
          if 'Please sign in before placing an order.' not in h:
            if place_marker not in h: raise SystemExit('placeOrder marker missing')
            h = h.replace(place_marker, place_new, 1)

          # Employee logout also revokes server-side refresh tokens before local Firebase sign-out.
          logout_start = h.index('async function logoutEmployee()')
          logout_end = h.index('\n        }', logout_start) + len('\n        }')
          logout = h[logout_start:logout_end]
          if 'revokeEmployeeSession' not in logout:
            logout_new = """async function logoutEmployee() {
              const dashboard = document.getElementById('employeeDashboard');
              const mainSite = document.getElementById('mainSite');
              const mainNav = document.getElementById('mainNav');
              currentEmployee = null;
              promotionsUnlocked = false;
              orders = [];
              users = {};
              employeeRoles = {};
              notifications = [];
              unreadNotifications = 0;
              if (dashboard) dashboard.classList.remove('active');
              if (mainSite) mainSite.style.display = 'block';
              if (mainNav) mainNav.style.display = 'flex';
              updateNotificationBadge();

              let revokeError = null;
              try {
                  if (auth?.currentUser && cloudFunctions) {
                      const revokeEmployeeSession = cloudFunctions.httpsCallable('revokeEmployeeSession');
                      await revokeEmployeeSession();
                  }
              } catch (error) {
                  revokeError = error;
                  console.error('Employee server-session revocation failed:', error);
              }

              try {
                  if (auth?.currentUser) await auth.signOut();
                  if (auth?.currentUser) throw new Error('Firebase Authentication session is still active after sign-out.');
                  currentUser = null;
                  updateAuthButton();
              } catch (error) {
                  console.error('Employee logout failed:', error);
                  alert('Unable to securely sign out. Please try again.');
                  throw error;
              }

              if (revokeError) {
                  alert('You are signed out locally, but server-session revocation could not be confirmed. Sign in again before using employee tools.');
              }
          }"""
            h = h[:logout_start] + logout_new + h[logout_end:]

          hp.write_text(h)
          print('Applied final P0 hardening patches.')
          PY

      - name: Install backend dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check functions/index.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os, json
          json.loads(Path('database.rules.json').read_text())
          html=Path('index.html').read_text()
          checked=0
          for block in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
              if not block.strip() or (block.lstrip().startswith('{') and '"@context"' in block): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False); f.write(block); f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
              checked+=1
          print('Checked',checked,'inline JS blocks')
          PY

      - name: Adversarial P0 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          h=Path('index.html').read_text(); b=Path('functions/index.js').read_text(); rules=json.loads(Path('database.rules.json').read_text())['rules']

          # Employee auth/session: verified account + role + revocation-aware server authorization.
          assert 'This employee session has been revoked' in b
          assert 'exports.revokeEmployeeSession' in b and 'auth.revokeRefreshTokens(employee.uid)' in b
          for fn in ['getAdminData','adminWrite','updateOrder','createEmployeeResetLink']:
              pos=b.index('exports.'+fn); chunk=b[pos:pos+2500]
              assert 'getEmployeeForRequest(request' in chunk, fn
          lo=h[h.index('async function logoutEmployee()'):][:2600]
          assert "httpsCallable('revokeEmployeeSession')" in lo and 'await auth.signOut();' in lo
          assert 'currentEmployee = null;' in lo and 'orders = [];' in lo and 'users = {};' in lo and 'employeeRoles = {};' in lo

          # Customer auth remains Firebase-backed.
          assert h.count('auth.signInWithEmailAndPassword') >= 2
          assert 'auth.createUserWithEmailAndPassword' in h
          assert 'auth.sendPasswordResetEmail' in h
          assert 'firebase.auth.GoogleAuthProvider.credential(response.credential)' in h
          assert 'auth.signInWithCredential(googleCredential)' in h
          assert re.search(r'async function logoutUser\(\).*?await auth\.signOut\(\);',h,re.S)

          # Stock-affecting orders require a verified authenticated customer and bind email/uid server-side.
          create=b[b.index('exports.createOrder'):]
          assert 'await requireVerifiedCustomer(request)' in create[:1000]
          assert 'Order email must match the authenticated account.' in create[:3000]
          assert 'const uid = authenticatedCustomer.uid;' in create
          assert "paymentMethod !== 'cod'" in create
          assert "db.ref('/').transaction" in create
          assert 'root.counters.orderNumbers[year]' in create
          assert 'product.stock = currentStock - item.quantity' in create
          assert 'root.coupons[key].used' in create

          # Server quote remains authoritative and does not trust client totals/prices.
          assert 'function calculateQuote(' in b
          assert 'getDiscountedUnitPrice(product, productDiscounts)' in b
          assert 'request.data?.totals' not in create
          assert 'requested?.price' not in b
          assert 'quoteOrder' in b and 'calculateQuote(snap.val() || {}, request.data?.items, request.data?.couponCode)' in b

          # Coupon secrets are not database-readable or loaded publicly.
          assert rules['coupons']['.read'] is False
          assert "readPublicPath('coupons')" not in h
          assert "['coupons', data =>" not in h
          assert 'const coupon = coupons.find(c => c.code === code' not in h
          assert "httpsCallable('quoteOrder')" in h[h.index('async function applyCouponCode()'):h.index('function removeCouponCode')]

          # Customer database isolation and integrity.
          u=rules['users']['$uid']
          assert u['.read'] == 'auth != null && auth.uid === $uid'
          assert u['.write'] == 'auth != null && auth.uid === $uid'
          assert 'auth.token.email' in u['email']['.validate']
          assert u['orderHistory']['.validate'] == 'newData.val() === data.val()'
          assert u['password']['.validate'] is False
          assert u['$other']['.validate'] is False
          assert rules['orders']['.read'] is False and rules['orders']['.write'] is False
          assert rules['employeeRoles']['.read'] is False and rules['employeeRoles']['.write'] is False
          assert rules['counters']['.read'] is False and rules['counters']['.write'] is False

          # Non-admin client writes cannot inject raw markup into product records.
          assert "if (path === 'products') dataToSave = sanitizeProducts(data);" in b
          assert 'cleanMarkupText(product.name' in b and 'cleanImageSource(product.image)' in b

          # Order UI status workflow is not narrowed below existing business statuses.
          for status in ['pending','processing','shipped','delivered','paid','fulfilled','cancelled']:
              assert "'"+status+"'" in b[b.index('const allowedStatuses'):b.index('const allowedStatuses')+250]

          # Stored customer/order rendering path retains escaping.
          assert 'escapeHTML(order.customer)' in h
          assert 'escapeHTML(item.product)' in h
          assert 'escapeHTML(notif.message)' in h
          assert 'escapeHTML(notif.title)' in h

          print('All adversarial P0 invariants passed.')
          PY

      - name: Check diff and scope
        run: |
          git diff --check
          git diff --stat
          git diff -- functions/index.js database.rules.json index.html

      - name: Commit production P0 hardening
        run: |
          if git diff --quiet -- functions/index.js database.rules.json index.html; then
            echo no-production-change
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/index.js database.rules.json index.html
          git commit -m 'Complete P0 security hardening'
          git push origin HEAD:agent/p0-security-commerce

      - name: Final committed checks
        run: |
          git diff --check HEAD^ HEAD
          git status --short
