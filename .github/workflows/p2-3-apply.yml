name: P2.3 collection shop apply
on:
  push:
    branches:
      - agent/p1-final-validation
    paths:
      - .github/workflows/p2-3-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-visual-ux
          fetch-depth: 0
      - name: Verify approved P2.2 source
        run: |
          test "$(git rev-parse HEAD)" = "6534f9558e94f91b849c366489246578a5ddc490"
          test -z "$(git status --porcelain)"
      - name: Apply contained P2.3 catalogue redesign
        run: |
          git show origin/agent/p1-final-validation:validation/apply_p2_3.py > /tmp/apply_p2_3.py
          python3 /tmp/apply_p2_3.py
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          python3 - <<'PY' > /tmp/index-inline.js
          from pathlib import Path
          import re
          h = Path('index.html').read_text()
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', h, re.S | re.I):
              if 'application/ld+json' in attrs.lower() or not body.strip():
                  continue
              print(body)
          PY
          node --check /tmp/index-inline.js
      - name: Commit contained production change
        run: |
          git config user.name "kemeg25-create"
          git config user.email "kem.eg25@gmail.com"
          git add index.html
          git commit -m "Implement P2.3 collection and shop redesign"
          test "$(git diff --name-only HEAD^ HEAD)" = "index.html"
          git push origin HEAD:agent/p2-visual-ux
