name: P1 reconciled committed-source validation
on:
  push:
    branches:
      - agent/p1-final-validation
    paths:
      - .github/workflows/p1-reconciled-final-validation.yml
      - validation/prepare_emulator.py
      - validation/patch_functions_runtime.py
      - validation/full_runtime_patch.py
      - validation/p1_reconciliation_targeted.cjs
      - validation/dashboard_targeted.cjs
      - validation/smoke.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Load exact reconciled P1 production source
        run: |
          git fetch origin agent/p1-remediation
          test "$(git rev-parse origin/agent/p1-remediation)" = "471860f83750cd239627213608f7fd7b39d41adf"
          test "$(git diff --name-only a7848a7ba6f97afd6505a83bc2fb8447a23973f9 471860f83750cd239627213608f7fd7b39d41adf)" = $'functions/index.js\nindex.html'
          git checkout 471860f83750cd239627213608f7fd7b39d41adf -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
          git diff --exit-code 471860f83750cd239627213608f7fd7b39d41adf -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
          python3 - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(); f=Path('functions/index.js').read_text()
          required_html=[
            '.about-content, .about-content > * { min-width:0; }',
            '.stats { grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; }',
            '.stat-item { padding:1rem; }',
            "el.querySelectorAll('button[data-category]').forEach(button => button.addEventListener('click', () => filterByCategory(button.dataset.category)));",
            "gallery.querySelectorAll('button[data-image-index]').forEach(button => button.addEventListener('click', () => selectProductImage(images[Number(button.dataset.imageIndex)], button)));",
            "sizesEl.querySelectorAll('button[data-variant-index]').forEach(button => button.addEventListener('click', () => selectProductVariant('size', sizes[Number(button.dataset.variantIndex)], button)));",
            "colorsEl.querySelectorAll('button[data-variant-index]').forEach(button => button.addEventListener('click', () => selectProductVariant('color', colors[Number(button.dataset.variantIndex)], button)));",
            "#employeeModal.active,.form-modal.active,.auth-modal.active,.product-detail-modal.active",
          ]
          for text in required_html: assert h.count(text)==1,(text,h.count(text))
          forbidden=[
            'onclick="filterByCategory(${JSON.stringify(name)})"',
            'onclick="selectProductImage(${JSON.stringify(src)},this)"',
            "onclick=\"selectProductVariant('size',${JSON.stringify(v)},this)\"",
            "onclick=\"selectProductVariant('color',${JSON.stringify(v)},this)\"",
          ]
          for text in forbidden: assert text not in h,text
          required_fn=[
            "const orderRootRef = db.ref('/');",
            "const initialOrderRoot = (await orderRootRef.once('value')).val();",
            'const transaction = await orderRootRef.transaction((root) => {',
            'if (root === null && initialOrderRoot !== null)',
          ]
          for text in required_fn: assert f.count(text)==1,(text,f.count(text))
          print('All four reconciliation fixes are present in committed production source before emulator preparation')
          PY
      - name: Install emulator and Chromium tooling
        run: |
          npm --prefix functions install --ignore-scripts --no-audit --no-fund
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false firebase-tools playwright >/dev/null
          npx playwright install --with-deps chromium
      - name: Prepare emulator routing only
        run: |
          python3 validation/prepare_emulator.py
          python3 validation/patch_functions_runtime.py
          python3 validation/full_runtime_patch.py
          python3 -m json.tool firebase.json >/dev/null
          node --check functions/index.js
          node --check validation/p1_reconciliation_targeted.cjs
          node --check validation/dashboard_targeted.cjs
          node --check validation/smoke.cjs
          git diff -U0 471860f83750cd239627213608f7fd7b39d41adf -- index.html functions/index.js > /tmp/runtime-app.diff || true
          if grep -E 'about-content|data-category|data-image-index|data-variant-index|employeeModal\.active|orderRootRef|initialOrderRoot|transaction\(\(root' /tmp/runtime-app.diff; then
            echo 'Runtime preparation altered reconciled application behavior'
            cat /tmp/runtime-app.diff
            exit 1
          fi
          echo 'Runtime diff is limited to emulator endpoint/configuration wiring'
      - name: Targeted reconciliation browser validation
        env:
          NODE_PATH: ${{ github.workspace }}/functions/node_modules:${{ github.workspace }}/node_modules
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          GCLOUD_PROJECT: demo-kem-validation
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 90s node validation/p1_reconciliation_targeted.cjs"
      - name: Targeted dashboard responsive validation
        env:
          NODE_PATH: ${{ github.workspace }}/functions/node_modules:${{ github.workspace }}/node_modules
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          GCLOUD_PROJECT: demo-kem-validation
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 90s node validation/dashboard_targeted.cjs"
      - name: Complete committed-source real-browser integration suite
        env:
          NODE_PATH: ${{ github.workspace }}/functions/node_modules:${{ github.workspace }}/node_modules
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9000
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
          GCLOUD_PROJECT: demo-kem-validation
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx firebase emulators:exec --project demo-kem-validation --only auth,database,functions,hosting,storage --log-verbosity=INFO "node validation/seed.cjs && timeout 180s node validation/smoke.cjs"
      - name: Restore exact source and rerun P0/P1 guards
        if: always()
        run: |
          git checkout -- validation/smoke.cjs validation/seed.cjs
          git checkout 471860f83750cd239627213608f7fd7b39d41adf -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
          rm -f package.json package-lock.json firebase-debug.log database-debug.log ui-debug.log validation/p1-reconciliation-targeted-failure.png validation/dashboard-targeted-failure.png
          rm -rf node_modules functions/node_modules functions/package-lock.json
          node --check functions/index.js
          python3 -m json.tool database.rules.json >/dev/null
          python3 -m json.tool firebase.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess,tempfile,os
          h=Path('index.html').read_text(); b=Path('functions/index.js').read_text(); rules=json.loads(Path('database.rules.json').read_text())['rules']
          blocks=re.findall(r'<script\s+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',h,re.S|re.I)
          assert blocks
          for body in blocks: json.loads(body)
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I):
              if 'application/ld+json' in attrs.lower() or not body.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False);f.write(body);f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          assert h.count("window.addEventListener('popstate'")==1
          assert h.count("document.addEventListener('keydown', event => {")==1
          assert 'exports.revokeEmployeeSession' in b and 'auth.revokeRefreshTokens' in b
          assert 'tokensValidAfterTime' in b and 'auth_time' in b
          assert 'requireVerifiedCustomer' in b and 'email_verified' in b
          assert "paymentMethod !== 'cod'" in b
          assert "const orderRootRef = db.ref('/');" in b
          assert 'const transaction = await orderRootRef.transaction((root) => {' in b
          assert 'product.stock = currentStock - item.quantity' in b
          assert rules['orders']['.read'] is False and rules['orders']['.write'] is False
          assert rules['employeeRoles']['.read'] is False and rules['employeeRoles']['.write'] is False
          assert rules['coupons']['.read'] is False and rules['coupons']['.write'] is False
          assert 'request.data?.price' not in b
          assert 'exports.getCustomerOrders' in b and 'exports.uploadProductImage' in b
          assert "order?.customerUid === uid" in b
          assert '.about-content, .about-content > * { min-width:0; }' in h
          assert "#employeeModal.active,.form-modal.active,.auth-modal.active,.product-detail-modal.active" in h
          print('Exact reconciled source and P0/P1 guards verified')
          PY
          git diff --check
          git diff --exit-code 471860f83750cd239627213608f7fd7b39d41adf -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
