name: Apply and verify P0 security fixes

on:
  push:
    branches:
      - agent/p0-security-commerce
    paths:
      - .github/workflows/p0-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out P0 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-security-commerce
          fetch-depth: 0

      - name: Tighten backend employee verification and legacy credential cleanup
        run: python scripts/patch-backend.py

      - name: Apply storefront P0 patch
        run: python scripts/apply-p0.py

      - name: Normalize obsolete legacy P0 branches
        run: python scripts/fix-legacy-p0-remnants.py

      - name: Verify backend syntax
        run: node --check functions/index.js

      - name: Verify inline JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, tempfile, os

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.buf = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag != 'script':
                      return
                  attrs = dict(attrs)
                  if attrs.get('src') or attrs.get('type') == 'application/ld+json':
                      return
                  self.capture = True
                  self.buf = []
              def handle_data(self, data):
                  if self.capture:
                      self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.capture:
                      self.scripts.append(''.join(self.buf))
                      self.capture = False

          parser = Scripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if not parser.scripts:
              raise SystemExit('No inline scripts found')

          for i, script in enumerate(parser.scripts):
              fd, name = tempfile.mkstemp(suffix='.js')
              os.close(fd)
              Path(name).write_text(script, encoding='utf-8')
              result = subprocess.run(['node', '--check', name], text=True, capture_output=True)
              if result.returncode:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(f'Inline script {i} has invalid JavaScript syntax')
          print(f'Validated {len(parser.scripts)} inline JavaScript block(s).')

      - name: Verify P0 security invariants
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          backend = Path('functions/index.js').read_text(encoding='utf-8')
          rules = Path('database.rules.json').read_text(encoding='utf-8')

          forbidden = [
              "Your current password is:",
              "password: '270913'",
              "correctPin = '1987'",
              "passcode === '200616'",
              "pin !== '1978'",
              "Authorization': `Bearer ${fawaterakConfig.apiKey}`",
              "saveToFirebase('orders', orders);",
              "saveToFirebase('users', users);"
          ]
          for item in forbidden:
              if item in html:
                  raise SystemExit(f'Forbidden P0 pattern remains in index.html: {item}')

          required_html = [
              "auth.signInWithEmailAndPassword",
              "auth.createUserWithEmailAndPassword",
              "auth.sendPasswordResetEmail",
              "firebase.auth.GoogleAuthProvider.credential",
              "cloudFunctions.httpsCallable('createOrder')",
              "cloudFunctions.httpsCallable('quoteOrder')",
              "cloudFunctions.httpsCallable('getEmployeeProfile')",
              "escapeHTML(notif.message)",
              "await loadAdminData()"
          ]
          for item in required_html:
              if item not in html:
                  raise SystemExit(f'Required P0 control missing from index.html: {item}')

          required_backend = [
              "request.auth.token.email_verified !== true",
              "db.ref('/').transaction",
              "paymentMethod !== 'cod'",
              "exports.quoteOrder",
              "exports.createOrder",
              "exports.adminWrite",
              "exports.updateOrder",
              "cleanup[`users/${key}/password`] = null"
          ]
          for item in required_backend:
              if item not in backend:
                  raise SystemExit(f'Required P0 control missing from backend: {item}')

          if '"orders": {\n      ".read": false,\n      ".write": false' not in rules:
              raise SystemExit('Orders are not locked down in database rules')
          if '"employeeRoles": {\n      ".read": false,\n      ".write": false' not in rules:
              raise SystemExit('Employee roles are not locked down in database rules')
          print('P0 security invariants verified.')

      - name: Check patch cleanliness
        run: |
          git diff --check
          git status --short

      - name: Commit verified P0 changes
        run: |
          git config user.name "KEM Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html functions/index.js
          git diff --cached --check
          git commit -m "Fix P0 security and commerce integrity"
          git push origin agent/p0-security-commerce
