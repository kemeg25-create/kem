name: Dispatch P2.2 validation
on:
  push:
    branches:
      - agent/p1-final-validation
    paths:
      - .github/workflows/dispatch-p2-2-validation.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch authoritative P2.2 validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run p2-2-validation.yml --repo kemeg25-create/kem --ref agent/p1-final-validation
