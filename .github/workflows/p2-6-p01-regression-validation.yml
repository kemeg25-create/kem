name: P2.6 P0 P1 regression committed-source validation

on:
  push:
    branches: [agent/p1-final-validation]
    paths:
      - validation/remediate_p2_6_p01_regression.py
      - validation/run_p2_6_full_chain.sh
      - .github/workflows/p2-6-p01-regression-validation.yml

permissions:
  contents: write

jobs:
  remediate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }

      - name: Gate current P2.6 and amend only index.html
        run: |
          set -euo pipefail
          P25=eadc7b2016f3bd1fb5b531cc547cac00686453d3
          OLDP26=9aac91d32ed380c231d8bf2985eabd583817e9ae
          git fetch origin agent/p2-visual-ux
          test "$(git rev-parse origin/agent/p2-visual-ux)" = "$OLDP26"
          test "$(git rev-parse $OLDP26^)" = "$P25"
          test "$(git rev-list --count $P25..$OLDP26)" = "1"
          test "$(git diff --name-only $P25 $OLDP26)" = "index.html"
          cp validation/remediate_p2_6_p01_regression.py /tmp/remediate.py
          git checkout -B p26-remediate "$OLDP26"
          python3 /tmp/remediate.py index.html
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          git diff --exit-code -- functions database.rules.json firebase.json storage.rules 2>/dev/null || exit 1
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          h=Path('index.html').read_text()
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I):
              if 'application/ld+json' in attrs.lower() or not body.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False);f.write(body);f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          assert "async function handleForgotPassword(){const m=document.getElementById('authModal');if(m?.classList.contains('active')){showPasswordReset();return}" in h
          assert "if(loginIdentifier)loginIdentifier.value=email;" in h
          assert "prompt('Enter your email address to reset your password:')" not in h
          assert "auth.sendPasswordResetEmail(email)" in h
          assert "openAccountModal(){if(document.getElementById('cartPage')?.classList.contains('active')||document.getElementById('checkoutPage')?.classList.contains('active'))return;" in h
          PY
          git config user.name 'KEM Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit --amend --no-edit
          test "$(git log -1 --format=%s)" = "Implement P2.6 account and authentication redesign"
          test "$(git rev-parse HEAD^)" = "$P25"
          test "$(git rev-list --count $P25..HEAD)" = "1"
          test "$(git diff --name-only $P25 HEAD)" = "index.html"
          P26="$(git rev-parse HEAD)"
          git push --force-with-lease=refs/heads/agent/p2-visual-ux:$OLDP26 origin HEAD:agent/p2-visual-ux
          echo "P26=$P26" >> "$GITHUB_ENV"
          echo "P25=$P25" >> "$GITHUB_ENV"
          echo "FINAL_P26=$P26"

      - name: Load validation branch with exact amended source
        run: |
          set -euo pipefail
          git checkout agent/p1-final-validation
          git fetch origin agent/p2-visual-ux
          test "$(git rev-parse origin/agent/p2-visual-ux)" = "$P26"
          test "$(git rev-parse $P26^)" = "$P25"
          test "$(git rev-list --count $P25..$P26)" = "1"
          test "$(git diff --name-only $P25 $P26)" = "index.html"

      - name: Install emulator and Chromium tooling
        run: |
          npm --prefix functions install --ignore-scripts --no-audit --no-fund
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false firebase-tools playwright >/dev/null
          npx playwright install --with-deps chromium

      - name: Complete P2.6 and frozen browser chain
        run: bash validation/run_p2_6_full_chain.sh "$P25" "$P26"

      - name: Restore exact source and final security static guards
        if: always()
        run: |
          set -euo pipefail
          git checkout -- validation/smoke.cjs validation/seed.cjs || true
          git checkout "$P26" -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
          rm -f package.json package-lock.json firebase-debug.log database-debug.log ui-debug.log
          rm -rf node_modules functions/node_modules functions/package-lock.json
          node --check functions/index.js
          python3 -m json.tool database.rules.json >/dev/null
          python3 -m json.tool firebase.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess,tempfile,os
          h=Path('index.html').read_text();b=Path('functions/index.js').read_text();rules=json.loads(Path('database.rules.json').read_text())['rules']
          for body in re.findall(r'<script\s+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',h,re.S|re.I): json.loads(body)
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I):
              if 'application/ld+json' in attrs.lower() or not body.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False);f.write(body);f.close()
              try: subprocess.run(['node','--check',f.name],check=True)
              finally: os.unlink(f.name)
          for x in ['P2.6 — ACCOUNT / AUTHENTICATION','P2.5 — CART / CHECKOUT','P2.4 — PRODUCT DETAIL','P2.3 — COLLECTION / SHOP','P2.2 — HOMEPAGE','P2.1 — HEADER / NAVIGATION','--color-kem-pink: #FF3366;','@media (prefers-reduced-motion: reduce)']: assert x in h,x
          for x in ["auth.signInWithEmailAndPassword(email, password)","auth.createUserWithEmailAndPassword(email, password)",'credential.user.sendEmailVerification()',"auth.sendPasswordResetEmail(email)","cloudFunctions.httpsCallable('getCustomerOrders')",'async function logoutUser()','async function logoutEmployee()']: assert x in h,x
          assert 'requireVerifiedCustomer' in b and 'email_verified' in b and 'auth.revokeRefreshTokens' in b and 'tokensValidAfterTime' in b
          assert rules['orders']['.read'] is False and rules['orders']['.write'] is False and rules['employeeRoles']['.read'] is False and rules['employeeRoles']['.write'] is False
          assert 'exports.getCustomerOrders' in b and "order?.customerUid === uid" in b
          body_css=re.search(r'body\s*\{(.*?)\}',re.search(r'<style>(.*?)</style>',h,re.S|re.I).group(1),re.S).group(1)
          assert 'overflow-x: hidden' not in body_css
          assert h.count("window.addEventListener('popstate'")==1
          assert h.count("document.addEventListener('keydown', event => {")==1
          assert "prompt('Enter your email address to reset your password:')" not in h
          assert 'lockCustomerDialogScroll()' in h and "await openAccountModal();" in h
          assert '<span class="account-address-default">Default</span>' in h
          assert '#accountModal .close-modal:focus{outline:3px solid var(--color-kem-pink);outline-offset:3px}' in h
          assert "switchAuthTab('login');document.getElementById('loginIdentifier')?.focus();" in h
          assert '@media(max-width:768px){#accountModal .account-layout{grid-template-columns:1fr' in h
          assert "button.setAttribute('aria-label', 'Account');" in h
          assert "currentUser = null;\n            currentEmployee = null;\n            updateAuthButton();\n            if (auth) await auth.signOut();" in h
          assert "if (accountModal?.classList.contains('active')) closeAccountModal();" in h
          assert "openAccountModal(){if(document.getElementById('cartPage')?.classList.contains('active')||document.getElementById('checkoutPage')?.classList.contains('active'))return;" in h
          assert "async function handleForgotPassword(){const m=document.getElementById('authModal');if(m?.classList.contains('active')){showPasswordReset();return}" in h
          assert "if(loginIdentifier)loginIdentifier.value=email;" in h
          print('FINAL_SECURITY_STATIC_SOURCE_GUARDS=green')
          PY
          git diff --check
          test "$(git rev-parse $P26^)" = "$P25"
          test "$(git rev-list --count $P25..$P26)" = "1"
          test "$(git diff --name-only $P25 $P26)" = "index.html"
          git diff --exit-code "$P26" -- index.html functions database.rules.json firebase.json payment-success.html payment-failed.html robots.txt sitemap.xml apple-touch-icon.png favicon-64.png logo-240.png
